<!DOCTYPE html>
<html lang="en">
    <head>
        <title>three.js webgl - FBX loader - Standing 2H Magic Attack 01</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link type="text/css" rel="stylesheet" href="main.css">
    </head>

    <body>
        <div id="info">
            <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> FBXLoader - Standing 2H Magic Attack 01<br />
            Character and animation from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
        </div>

        <script type="importmap">
            {
                "imports": {
                    "three": "../build/three.module.js",
                    "three/addons/": "./jsm/"
                }
            }
        </script>

        <script type="module">

            import * as THREE from 'three';
            import Stats from 'three/addons/libs/stats.module.js';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
            import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
            import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

            const manager = new THREE.LoadingManager();

            let camera, scene, renderer, controls, stats, object, loader, guiMorphsFolder, guiAnimationsFolder;
            let mixer;

            const timer = new THREE.Timer();
            timer.connect( document );

            const params = {
                asset: 'Standing 2H Magic Attack 01'
            };

            const assets = [
                'Standing 2H Magic Attack 01'
            ];

            init();

            function init() {

                const container = document.createElement( 'div' );
                document.body.appendChild( container );

                camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 2000 );
                camera.position.set( 100, 200, 300 );

                scene = new THREE.Scene();
                scene.background = new THREE.Color( 0xa0a0a0 );
                scene.fog = new THREE.Fog( 0xa0a0a0, 200, 1000 );

                const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 3 );
                hemiLight.position.set( 0, 200, 0 );
                scene.add( hemiLight );

                const dirLight = new THREE.DirectionalLight( 0xffffff, 3 );
                dirLight.position.set( 0, 200, 100 );
                dirLight.castShadow = true;
                scene.add( dirLight );

                const topLight = new THREE.SpotLight( 0xffffff, 10 );
                topLight.position.set( 0, 350, 0 );
                topLight.castShadow = true;
                scene.add( topLight );

                const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 2000, 2000 ), new THREE.MeshPhongMaterial( { color: 0x999999, depthWrite: false } ) );
                mesh.rotation.x = - Math.PI / 2;
                mesh.receiveShadow = true;
                scene.add( mesh );

                const grid = new THREE.GridHelper( 2000, 20, 0x000000, 0x000000 );
                grid.material.opacity = 0.2;
                grid.material.transparent = true;
                scene.add( grid );
            
                loader = new FBXLoader( manager );
                loadAsset( params.asset );

                renderer = new THREE.WebGLRenderer( { antialias: true } );
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( window.innerWidth, window.innerHeight );
                renderer.setAnimationLoop( animate );
                renderer.shadowMap.enabled = true;
                container.appendChild( renderer.domElement );

                controls = new OrbitControls( camera, renderer.domElement );
                controls.enableZoom = true;
                controls.enablePan = true;
                controls.enableDamping = true;
                controls.target.set( 0, 100, 0 );
                controls.update();

                window.addEventListener( 'resize', onWindowResize );

                stats = new Stats();
                container.appendChild( stats.dom );

                const gui = new GUI();
                gui.add( params, 'asset', assets ).onChange( function ( value ) {
                    loadAsset( value );
                } );

                guiMorphsFolder = gui.addFolder( 'Morphs' ).hide();
                guiAnimationsFolder = gui.addFolder( 'Animations' ).hide();

            }

            function loadAsset( asset ) {

                const textureLoader = new THREE.TextureLoader();
                const texture = textureLoader.load( 'models/fbx/textures/textura2.jpg' );
                texture.colorSpace = THREE.SRGBColorSpace;

                loader.load( 'models/fbx/' + asset + '.fbx', function ( group ) {

                    if ( object ) {
                        scene.remove( object );
                    }

                    object = group;
                    object.scale.setScalar( 1 );

                    const customMaterial = new THREE.MeshPhongMaterial({
                        color: 0xffffff,
                        map: texture,
                        specular: 0x444444,
                        shininess: 30
                    });

                    object.traverse( function ( child ) {

                        if ( child.isMesh ) {

                            child.castShadow = true;
                            child.receiveShadow = true;
                            child.material = customMaterial;

                        }

                    } );

                    if ( object.animations && object.animations.length ) {

                        mixer = new THREE.AnimationMixer( object );
                        const action = mixer.clipAction( object.animations[ 0 ] );
                        action.play();

                    } else {

                        mixer = null;

                    }

                    scene.add( object );

                } );

            }

            function onWindowResize() {

                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize( window.innerWidth, window.innerHeight );

            }

            function animate() {

                timer.update();
                const delta = timer.getDelta();
                if ( mixer ) mixer.update( delta );
                controls.update();
                renderer.render( scene, camera );
                stats.update();

            }

        </script>
    </body>
</html>
